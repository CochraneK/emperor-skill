name: Nuwa L3 Semantic Review

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'data/corpus-gap.json'
      - '_redo_tools/_audit_l3_semantic_similarity.py'
      - '_redo_tools/_calibrate_l3_similarity.py'
      - '.github/workflows/nuwa-l3.yml'
  workflow_dispatch:

# Corpus Sync is the single writer for generated QA artifacts. This workflow only
# validates that the L3 scanners still compile, run and preserve their review-only
# semantics. Keeping it read-only prevents bot-vs-bot push races during bulk distill.
permissions:
  contents: read

concurrency:
  group: nuwa-l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-review-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile scanners
        run: |
          python -m py_compile _redo_tools/_audit_l3_semantic_similarity.py
          python -m py_compile _redo_tools/_calibrate_l3_similarity.py

      - name: Generate similarity baseline in workspace
        run: python _redo_tools/_calibrate_l3_similarity.py

      - name: Generate L3 review signals in workspace
        run: python _redo_tools/_audit_l3_semantic_similarity.py

      - name: Guard semantic meaning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          review=json.loads(Path('data/l3-semantic-review-queue.json').read_text(encoding='utf-8'))
          baseline=json.loads(Path('data/l3-similarity-baseline.json').read_text(encoding='utf-8'))
          assert review['status']=='GENERATED_REVIEW_SIGNALS_NOT_L3_VERDICTS'
          assert review['policy']['automatic_pass_fail'] is False
          assert baseline['status']=='DIAGNOSTIC_BASELINE_NOT_QUALITY_VERDICT'
          assert review['summary']['packages_scanned'] > 0
          print('L3 REVIEW')
          print(json.dumps(review['summary'], ensure_ascii=False, indent=2))
          print('SIMILARITY BASELINE')
          print(json.dumps(baseline['summary'], ensure_ascii=False, indent=2))
          PY

      - name: Confirm validation-only workflow
        run: |
          if ! git diff --quiet -- data/l3-semantic-review-queue.json data/l3-similarity-baseline.json assessment/L3_SEMANTIC_QA.md; then
            echo 'L3 generated artifacts differ from the checked-in snapshot.'
            echo 'Corpus Sync is the only workflow allowed to commit those changes.'
            git diff --stat -- data/l3-semantic-review-queue.json data/l3-similarity-baseline.json assessment/L3_SEMANTIC_QA.md
          else
            echo 'Checked-in L3 artifacts already match this validation run.'
          fi
