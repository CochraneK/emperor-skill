name: Nuwa L3 Semantic Review

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'data/corpus-gap.json'
      - '_redo_tools/_audit_l3_semantic_similarity.py'
      - '_redo_tools/_calibrate_l3_similarity.py'
      - '.github/workflows/nuwa-l3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuwa-l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-review-signals:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile scanners
        run: |
          python -m py_compile _redo_tools/_audit_l3_semantic_similarity.py
          python -m py_compile _redo_tools/_calibrate_l3_similarity.py

      - name: Generate similarity baseline
        run: python _redo_tools/_calibrate_l3_similarity.py

      - name: Generate L3 review signals
        run: python _redo_tools/_audit_l3_semantic_similarity.py

      - name: Guard semantic meaning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          review=json.loads(Path('data/l3-semantic-review-queue.json').read_text(encoding='utf-8'))
          baseline=json.loads(Path('data/l3-similarity-baseline.json').read_text(encoding='utf-8'))
          assert review['status']=='GENERATED_REVIEW_SIGNALS_NOT_L3_VERDICTS'
          assert review['policy']['automatic_pass_fail'] is False
          assert baseline['status']=='DIAGNOSTIC_BASELINE_NOT_QUALITY_VERDICT'
          assert review['summary']['packages_scanned'] > 0
          print('L3 REVIEW')
          print(json.dumps(review['summary'], ensure_ascii=False, indent=2))
          print('SIMILARITY BASELINE')
          print(json.dumps(baseline['summary'], ensure_ascii=False, indent=2))
          PY

      - name: Commit generated review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/l3-semantic-review-queue.json data/l3-similarity-baseline.json assessment/L3_SEMANTIC_QA.md
          if git diff --cached --quiet; then
            echo 'No L3 review-signal changes.'
            exit 0
          fi
          git commit -m 'chore: sync Nuwa L3 semantic review queue'
          git push
